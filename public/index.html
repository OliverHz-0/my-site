<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>研台 Lab Desk · 个人工作站</title>
  <meta name="description" content="研台 Lab Desk：把日常任务、项目和科研进展放在一处的个人工作站。任务、生活和公司记录是真实数据，标有「示例」的部分为演示内容。">
  <link rel="preload" href="fonts/IBMPlexSans-Latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="fonts/NotoSansSC-Subset.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="styles/app.css">
  <link rel="stylesheet" href="styles/site.css">
</head>
<body>
  <div class="app">
    <aside class="sidebar glass" data-kind="light" id="sidebar" aria-label="主导航">
      <a class="brand" href="#/overview" aria-label="研台 Lab Desk 总览">
        <svg class="brand-mark" viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <rect x="2.5" y="2.5" width="27" height="27" rx="7"/>
          <path d="M8 10.5h6M11 10.5v4.2c0 2.6-1 4.6-3 6.3M9 15.5h4.5M17.5 9h6v4.5h-6zM17 17h7M20.5 13.5V24M17.5 20.5l-1.5 3M23.5 20.5l1.5 3"/>
        </svg>
        <span><span class="brand-name">研台 Lab Desk</span><br><span class="brand-scope">个人工作站</span></span>
      </a>
      <nav class="nav" data-nav-group="main"></nav>
      <button class="group-label group-toggle" type="button" data-action="nav-group" data-group="research" aria-expanded="true" aria-controls="nav-research"><span>科研</span><svg class="fold-chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg></button>
      <div class="nav-fold" id="nav-research"><nav class="nav" data-nav-group="research" aria-label="科研"></nav></div>
      <button class="group-label group-toggle" type="button" data-action="nav-group" data-group="life" aria-expanded="true" aria-controls="nav-life"><span>生活</span><svg class="fold-chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg></button>
      <div class="nav-fold" id="nav-life"><nav class="nav" data-nav-group="life" aria-label="生活"></nav></div>
      <button class="group-label group-toggle" type="button" data-action="nav-group" data-group="company" aria-expanded="true" aria-controls="nav-company"><span>个人公司</span><svg class="fold-chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg></button>
      <div class="nav-fold" id="nav-company"><nav class="nav" data-nav-group="company" aria-label="个人公司"></nav></div>
      <button class="group-label group-toggle" type="button" data-action="nav-group" data-group="integrations" aria-expanded="true" aria-controls="nav-integrations"><span>集成</span><svg class="fold-chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg></button>
      <div class="nav-fold" id="nav-integrations"><nav class="nav" data-nav-group="integrations" aria-label="集成"></nav></div>
      <div class="bottom">
        <nav class="nav" data-nav-group="bottom" aria-label="设置"></nav>
        <p class="sample-note">标有「示例」的为演示数据</p>
      </div>
    </aside>
    <div class="scrim" id="scrim"></div>
    <div class="canvas">
      <div class="mobile-bar">
        <div class="left">
          <button class="icon-btn bare" type="button" data-action="open-nav" aria-label="打开导航" aria-expanded="false" aria-controls="sidebar" id="menu-btn"></button>
          <a class="brand" href="#/overview"><span class="brand-name">研台</span></a>
        </div>
        <div class="right">
          <button class="icon-btn bare" type="button" data-action="search" aria-label="搜索"></button>
          <button class="btn primary" type="button" data-action="create" aria-haspopup="menu">新建</button>
        </div>
      </div>
      <main id="view" tabindex="-1"></main>
    </div>
  </div>
  <div id="layers"></div>
  <script src="scripts/charts.js"></script>
  <script src="scripts/data.js"></script>
  <script src="scripts/api.js"></script>
  <script src="scripts/app.js"></script>
  <script type="module" src="scripts/glass.js"></script>
</body>
</html>
